<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>猫厕所</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #3B82F6;
            --primary-light: #DBEAFE;
            --primary-dark: #2563EB;
            --secondary: #8B5CF6;
            --bg: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-primary: #1E293B;
            --text-secondary: #64748B;
            --text-muted: #94A3B8;
            --border: #E2E8F0;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #DBEAFE 0%, #F8FAFC 100%);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            padding: 0 0 40px;
            min-height: 100vh;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-btn {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-md);
            background: var(--card-bg);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .back-btn:hover {
            color: var(--primary);
            border-color: var(--primary-light);
        }

        h1 {
            font-size: 20px;
            margin: 0;
            font-weight: 800;
            flex: 1;
            text-align: center;
            letter-spacing: -0.3px;
        }

        .refresh-btn {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-md);
            background: var(--card-bg);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .refresh-btn:hover {
            color: var(--primary);
            border-color: var(--primary-light);
        }

        .device-card {
            background: var(--card-bg);
            border-radius: var(--radius-xl);
            padding: 28px 24px;
            box-shadow: var(--shadow-md);
            margin: 24px 16px;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .device-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
        }

        .device-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 28px;
        }

        .device-title-section {
            flex: 1;
        }

        .device-name {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .device-badge {
            font-size: 12px;
            color: var(--primary);
            background: var(--primary-light);
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            font-weight: 600;
        }

        .status-badge {
            font-size: 13px;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow-sm);
        }

        .status-idle {
            background: linear-gradient(135deg, #DBEAFE 0%, #BFDBFE 100%);
            color: var(--primary);
        }

        .status-working {
            background: linear-gradient(135deg, #FEF3C7 0%, #FDE68A 100%);
            color: #D97706;
        }

        .status-error {
            background: linear-gradient(135deg, #FEE2E2 0%, #FECACA 100%);
            color: #DC2626;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 28px;
        }

        .stat-card {
            text-align: center;
            background: linear-gradient(135deg, #F8FAFC 0%, #F1F5F9 100%);
            padding: 20px 12px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            transition: all 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 12px;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, var(--primary-light) 0%, #C7D2FE 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: var(--primary);
        }

        .stat-value {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            background: linear-gradient(135deg, #F8FAFC 0%, #F1F5F9 100%);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 28px;
            border: 1px solid var(--border);
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: var(--text-secondary);
            padding: 8px;
        }

        .info-icon {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 16px;
            box-shadow: var(--shadow-sm);
        }

        .info-content {
            flex: 1;
        }

        .info-label {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 2px;
            font-weight: 500;
        }

        .info-value {
            font-size: 14px;
            color: var(--text-primary);
            font-weight: 600;
        }

        .info-item.alert {
            color: var(--danger);
        }

        .info-item.alert .info-value {
            color: var(--danger);
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn {
            border: none;
            padding: 16px;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .btn-primary:hover {
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: white;
            color: var(--primary);
            border: 2px solid var(--primary-light);
        }

        .btn-secondary:hover {
            background: var(--primary-light);
            border-color: var(--primary);
        }

        .loading-mask {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.9);
            z-index: 99;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }

        .hidden {
            display: none !important;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: linear-gradient(135deg, #1E293B 0%, #0F172A 100%);
            color: white;
            padding: 14px 28px;
            border-radius: var(--radius-xl);
            font-size: 14px;
            font-weight: 600;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            z-index: 100;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s;
            backdrop-filter: blur(8px);
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: white;
            width: 85%;
            max-width: 340px;
            border-radius: var(--radius-xl);
            padding: 32px 24px 24px;
            text-align: center;
            transform: translateY(20px) scale(0.9);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border);
        }

        .modal-overlay.show .modal-content {
            transform: translateY(0) scale(1);
        }

        .modal-icon {
            font-size: 56px;
            color: var(--warning);
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .modal-desc {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 28px;
            line-height: 1.6;
        }

        .modal-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .modal-btn {
            border: none;
            padding: 14px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-btn-cancel {
            background: #F1F5F9;
            color: var(--text-primary);
        }

        .modal-btn-cancel:hover {
            background: #E2E8F0;
        }

        .modal-btn-confirm {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .modal-btn-confirm:hover {
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <button class="back-btn" onclick="location.href='/'">
                <i class="fas fa-chevron-left"></i>
            </button>
            <h1>猫厕所</h1>
            <button class="refresh-btn" onclick="forceRefreshData()">
                <i class="fas fa-sync-alt"></i>
            </button>
        </header>

        <div id="device-list">
            <!-- Devices will be rendered here -->
        </div>
    </div>

    <div id="loading" class="loading-mask">
        <div style="text-align:center; color: var(--primary);">
            <i class="fas fa-circle-notch fa-spin fa-2x"></i>
        </div>
    </div>

    <div id="toast" class="toast">操作成功</div>

    <!-- Custom Modal -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-icon"><i class="fas fa-exclamation-circle"></i></div>
            <div id="modal-title" class="modal-title">确认操作</div>
            <div id="modal-desc" class="modal-desc">确定要执行此操作吗？</div>
            <div class="modal-actions">
                <button class="modal-btn modal-btn-cancel" onclick="closeModal()">取消</button>
                <button id="modal-confirm-btn" class="modal-btn modal-btn-confirm">确定</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '';
        let pendingAction = null;

        // Get device_id from URL if any
        const urlParams = new URLSearchParams(window.location.search);
        const targetDeviceId = urlParams.get('device_id');

        async function fetchDevices() {
            showLoading(true);
            try {
                // 使用合并接口一次性获取设备和统计数据
                const response = await fetch(`${API_BASE}/api/petkit/devices-stats`);
                const devicesWithStats = await response.json();

                // 分离设备列表和统计数据
                const devices = devicesWithStats.map(d => ({
                    id: d.id,
                    name: d.name,
                    type: d.type,
                    data: d.data,
                    state_summary: d.state_summary  // 保留state_summary用于渲染
                }));

                // 从第一个设备的state_summary中获取统计信息
                const dailyStats = devicesWithStats.length > 0 ?
                    devicesWithStats[0].state_summary || {} : {};

                renderDevices(devices, dailyStats);
            } catch (error) {
                showToast('加载失败: ' + error.message);
            } finally {
                showLoading(false);
            }
        }

        function renderDevices(devices, dailyStats) {
            const container = document.getElementById('device-list');
            container.innerHTML = '';

            // Filter for litterboxes
            let litterboxes = devices.filter(d =>
                ['T3', 'T4', 'T4 Pura MAX', 'T5'].includes(d.type) ||
                (d.name && d.name.includes('MAX'))
            );

            // If device_id is provided, filter for that specific device
            if (targetDeviceId) {
                litterboxes = litterboxes.filter(d => d.id == targetDeviceId);
            }

            if (litterboxes.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:#999; margin-top:50px;">未找到设备</div>';
                return;
            }

            litterboxes.forEach(device => {
                // 优先使用设备自身的state_summary，如果没有则使用全局的dailyStats
                const stats = device.state_summary || dailyStats || {};

                // Parse Status
                let statusText = '空闲中';
                let statusClass = 'status-idle';
                let statusIcon = 'fa-check-circle';

                // Check specific flags if available
                if (stats.box_full) {
                    statusText = '集便盒已满';
                    statusClass = 'status-error';
                    statusIcon = 'fa-exclamation-circle';
                } else if (stats.work_state && stats.work_state !== 0) {
                    statusText = '工作中';
                    statusClass = 'status-working';
                    statusIcon = 'fa-cog fa-spin';
                }

                // 使用准确的今日统计数据（优先使用dailyStats）
                const accurateTodayVisits = dailyStats.today_visits || 0;
                const accurateAvgDuration = dailyStats.avg_duration || 0;
                const accurateLastPetWeight = dailyStats.last_pet_weight ? dailyStats.last_pet_weight.toFixed(2) : '0.00';

                // Data Formatting (优先使用准确的统计数据，回退到原有数据)
                const sand = stats.sand_percent || 0;
                const liquid = stats.deodorant_left_days || 0;
                const sandWeight = ((stats.sand_weight || stats.weight || 0) / 1000).toFixed(2);

                // 优先使用 state_summary 中的准确数据（我们现在添加了）
                const petWeight = stats.last_pet_weight ? stats.last_pet_weight.toFixed(2) : accurateLastPetWeight;
                const times = stats.today_visits || accurateTodayVisits;
                const avgDuration = stats.avg_duration || accurateAvgDuration;

                // 频繁如厕val值映射：有频繁如厕显示"有"，无频繁如厕显示"无"
                let frequentRestroomText = '无';
                if (stats.frequent_restroom !== undefined) {
                    frequentRestroomText = stats.frequent_restroom ? '有' : '无';
                } else if (dailyStats.frequent_restroom !== undefined) {
                    frequentRestroomText = dailyStats.frequent_restroom ? '有' : '无';
                } else if (stats.frequent_restroom_val !== undefined) {
                    // 处理不同的val值格式
                    const val = stats.frequent_restroom_val;
                    if (typeof val === 'boolean') {
                        frequentRestroomText = val ? '有' : '无';
                    } else if (typeof val === 'number') {
                        frequentRestroomText = val > 0 ? '有' : '无';
                    } else if (typeof val === 'string') {
                        frequentRestroomText = val.toLowerCase() === 'true' || val === '1' ? '有' : '无';
                    }
                }

                const html = `
                    <div class="device-card">
                        <div class="device-header">
                            <div class="device-title-section">
                                <div class="device-name">${device.name}</div>
                                <div class="device-badge">${device.type}</div>
                            </div>
                            <div class="status-badge ${statusClass}">
                                <i class="fas ${statusIcon}"></i>
                                <span>${statusText}</span>
                            </div>
                        </div>

                        <div class="stats-grid">
                            <div class="stat-card">
                                <div class="stat-icon">
                                    <i class="fas fa-chart-line"></i>
                                </div>
                                <div class="stat-value">${times}次</div>
                                <div class="stat-label">今日如厕</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-icon">
                                    <i class="fas fa-stopwatch"></i>
                                </div>
                                <div class="stat-value">${avgDuration}s</div>
                                <div class="stat-label">平均时长</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-icon">
                                    <i class="fas fa-cat"></i>
                                </div>
                                <div class="stat-value">${petWeight}kg</div>
                                <div class="stat-label">最近猫重</div>
                            </div>
                        </div>

                        <div class="info-grid">
                            <div class="info-item ${frequentRestroomText === '有' ? 'alert' : ''}">
                                <div class="info-icon">
                                    <i class="fas fa-bell"></i>
                                </div>
                                <div class="info-content">
                                    <div class="info-label">频繁如厕</div>
                                    <div class="info-value">${frequentRestroomText}${frequentRestroomText === '有' ? ' (预警!)' : ''}</div>
                                </div>
                            </div>
                            <div class="info-item">
                                <div class="info-icon">
                                    <i class="fas fa-layer-group"></i>
                                </div>
                                <div class="info-content">
                                    <div class="info-label">猫砂余量</div>
                                    <div class="info-value">${sand}%</div>
                                </div>
                            </div>
                            <div class="info-item">
                                <div class="info-icon">
                                    <i class="fas fa-weight-hanging"></i>
                                </div>
                                <div class="info-content">
                                    <div class="info-label">盆内砂重</div>
                                    <div class="info-value">${sandWeight}kg</div>
                                </div>
                            </div>
                            <div class="info-item">
                                <div class="info-icon">
                                    <i class="fas fa-spray-can"></i>
                                </div>
                                <div class="info-content">
                                    <div class="info-label">除臭液</div>
                                    <div class="info-value">${liquid}天</div>
                                </div>
                            </div>
                            <div class="info-item ${stats.box_full ? 'alert' : ''}">
                                <div class="info-icon">
                                    <i class="fas fa-trash-alt"></i>
                                </div>
                                <div class="info-content">
                                    <div class="info-label">集便盒</div>
                                    <div class="info-value">${stats.box_full ? '已满!' : '正常'}</div>
                                </div>
                            </div>
                            <div class="info-item">
                                <div class="info-icon">
                                    <i class="fas fa-wifi"></i>
                                </div>
                                <div class="info-content">
                                    <div class="info-label">连接状态</div>
                                    <div class="info-value">正常</div>
                                </div>
                            </div>
                        </div>

                        <div class="action-buttons">
                            <button class="btn btn-primary" onclick="showConfirm('${device.id}', 'clean')">
                                <i class="fas fa-broom"></i>
                                <span>立即清理</span>
                            </button>
                            <button class="btn btn-secondary" onclick="showConfirm('${device.id}', 'deodorize')">
                                <i class="fas fa-wind"></i>
                                <span>立即除臭</span>
                            </button>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        function showConfirm(deviceId, action) {
            const title = action === 'clean' ? '开始清理' : '喷射除臭液';
            const desc = action === 'clean' ? '确定要开始自动清理猫砂盆吗？' : '确定要立即喷射除臭液吗？此操作可能消耗除臭耗材。';

            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-desc').innerText = desc;

            const overlay = document.getElementById('modal-overlay');
            overlay.classList.add('show');

            // Set confirm button handler
            const confirmBtn = document.getElementById('modal-confirm-btn');
            confirmBtn.onclick = () => {
                closeModal();
                executeControl(deviceId, action);
            };
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('show');
        }

        async function executeControl(deviceId, action) {
            const btnSelector = `button[onclick="showConfirm('${deviceId}', '${action}')"]`;
            const btn = document.querySelector(btnSelector);
            if (!btn) return;

            const card = btn.closest('.device-card');
            const statusTag = card.querySelector('.status-tag');
            const originalStatusHTML = statusTag.innerHTML;
            const originalStatusClass = statusTag.className;

            statusTag.className = 'status-tag status-working';
            statusTag.innerHTML = `<i class="fas fa-circle-notch fa-spin"></i> 指令发送中...`;
            btn.disabled = true;

            try {
                const endpoint = action === 'clean' ? 'clean' : 'deodorize';
                const response = await fetch(`${API_BASE}/api/petkit/${endpoint}?device_id=${deviceId}`, {
                    method: 'POST'
                });

                if (response.ok) {
                    showToast('指令发送成功');
                    statusTag.innerHTML = `<i class="fas fa-cog fa-spin"></i> ${action === 'clean' ? '正在清理...' : '正在除臭...'}`;

                    setTimeout(fetchDevices, 2000);
                    setTimeout(fetchDevices, 5000);
                    setTimeout(fetchDevices, 10000);
                } else {
                    const err = await response.json();
                    throw new Error(err.detail || '请求失败');
                }
            } catch (error) {
                showToast(error.message);
                statusTag.className = originalStatusClass;
                statusTag.innerHTML = originalStatusHTML;
            } finally {
                btn.disabled = false;
            }
        }

        function showLoading(show) {
            document.getElementById('loading').classList.toggle('hidden', !show);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        async function forceRefreshData() {
            try {
                showToast('正在强制刷新数据...');
                const response = await fetch(`${API_BASE}/api/cache/refresh`, { method: 'POST' });
                const result = await response.json();
                if (result.status === 'success') {
                    showToast('数据已强制刷新');
                    // 立即重新获取数据
                    await fetchDevices();
                } else {
                    showToast('刷新失败: ' + (result.message || '未知错误'));
                }
            } catch (error) {
                showToast('刷新失败: ' + error.message);
            }
        }

        fetchDevices();
        // 每30秒自动刷新（使用缓存）
        setInterval(fetchDevices, 30000);

        // 每5分钟强制刷新第三方接口数据
        setInterval(forceRefreshThirdPartyData, 300000);

        async function forceRefreshThirdPartyData() {
            try {
                const response = await fetch(`${API_BASE}/api/cache/refresh`, { method: 'POST' });
                const result = await response.json();
                if (result.status === 'success') {
                    console.log('第三方接口数据已强制刷新');
                    // 刷新显示数据
                    await fetchDevices();
                }
            } catch (error) {
                console.error('强制刷新失败:', error);
            }
        }
    </script>
</body>
</html>

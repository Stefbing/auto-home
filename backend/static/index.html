<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的智能家</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #3B82F6;
            --primary-light: #DBEAFE;
            --secondary: #8B5CF6;
            --accent: #F59E0B;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --bg: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-primary: #1E293B;
            --text-secondary: #64748B;
            --text-muted: #94A3B8;
            --border: #E2E8F0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --text-main: #333333;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #F0F9FF 0%, #F8FAFC 100%);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        .app-header {
            padding: 20px 16px; /* Match container padding */
            background: transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 480px; /* Match container width */
            margin: 0 auto;
            margin-bottom: 4px; /* Slight spacing */
        }

        .app-title {
            font-size: 24px; /* Slightly smaller for mobile feel */
            font-weight: 700;
            margin: 0;
            color: var(--text-main);
        }

        .add-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--primary);
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }
        .add-btn:active { transform: scale(0.95); }

        .container {
            padding: 24px 16px 100px;
            max-width: 480px;
            margin: 0 auto;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 32px 0 16px 4px;
        }

        .section-icon {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--primary-light) 0%, #C7D2FE 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 16px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }

        .device-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .device-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        .device-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .device-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary-light);
        }

        .device-card:hover::before {
            opacity: 1;
        }

        .device-card:active {
            transform: scale(0.98);
        }

        /* Remove old split structure styles if conflicting, or override */
        .device-header { display: contents; } /* Unwrap header */
        .device-data {
            display: flex;
            flex-direction: row; /* Horizontal stats */
            gap: 16px;
            margin-top: 0;
            background: transparent;
            padding: 0;
            border-radius: 0;
            margin-left: auto; /* Push to right */
            align-items: center;
        }

        .device-icon-wrapper {
            width: 56px;
            height: 56px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
            position: relative;
        }

        .device-icon-wrapper.feeder {
            background: linear-gradient(135deg, #FEF3C7 0%, #FDE68A 100%);
            color: #F59E0B;
        }

        .device-icon-wrapper.litterbox {
            background: linear-gradient(135deg, #DBEAFE 0%, #BFDBFE 100%);
            color: #3B82F6;
        }

        .device-icon-wrapper.offline {
            background: linear-gradient(135deg, #F1F5F9 0%, #E2E8F0 100%);
            color: #94A3B8;
        }

        .status-indicator {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: var(--shadow-sm);
        }

        .status-indicator.online {
            background: var(--success);
        }

        .status-indicator.offline {
            background: var(--text-muted);
        }

        .device-info {
            flex: 1;
            min-width: 0;
        }

        .device-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
            letter-spacing: -0.2px;
        }

        .device-status {
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-text {
            font-weight: 500;
        }

        .device-stats {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .stat-item {
            text-align: right;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1.2;
            letter-spacing: -0.5px;
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        .chevron {
            color: var(--text-muted);
            font-size: 16px;
            transition: transform 0.2s;
        }

        .device-card:hover .chevron {
            transform: translateX(4px);
            color: var(--primary);
        }

        /* Modal Enhancement */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: var(--card-bg);
            width: 90%;
            max-width: 360px;
            border-radius: var(--radius-xl);
            padding: 32px 24px 24px;
            transform: scale(0.9) translateY(20px);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border);
        }

        .modal-overlay.show .modal-card {
            transform: scale(1) translateY(0);
        }

        .modal-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .modal-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .modal-desc {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .discovery-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .device-type-card {
            background: linear-gradient(135deg, #F8FAFC 0%, #FFFFFF 100%);
            border: 2px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 28px 24px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .device-type-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
            transform: scaleX(0);
            transition: transform 0.3s;
        }

        .device-type-card:hover {
            border-color: var(--primary-light);
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .device-type-card:hover::before {
            transform: scaleX(1);
        }

        .device-type-card:active {
            transform: scale(0.98);
        }

        .device-type-content {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .device-type-icon {
            width: 72px;
            height: 72px;
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            flex-shrink: 0;
            position: relative;
        }

        .device-type-icon.feeder {
            background: linear-gradient(135deg, #FEF3C7 0%, #FDE68A 100%);
            color: #F59E0B;
            box-shadow: 0 8px 16px rgba(245, 158, 11, 0.2);
        }

        .device-type-icon.litterbox {
            background: linear-gradient(135deg, #DBEAFE 0%, #BFDBFE 100%);
            color: #3B82F6;
            box-shadow: 0 8px 16px rgba(59, 130, 246, 0.2);
        }

        .device-type-info {
            flex: 1;
        }

        .device-type-title {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 6px;
            letter-spacing: -0.3px;
        }

        .device-type-desc {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .device-type-arrow {
            color: var(--text-muted);
            font-size: 20px;
            transition: all 0.2s;
        }

        .device-type-card:hover .device-type-arrow {
            transform: translateX(4px);
            color: var(--primary);
        }

        /* Toast Enhancement */
        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: linear-gradient(135deg, #1E293B 0%, #0F172A 100%);
            color: white;
            padding: 14px 28px;
            border-radius: var(--radius-xl);
            font-size: 14px;
            font-weight: 600;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            z-index: 2000;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>
    <div class="app-header">
        <h1 class="app-title">我的智能家</h1>
        <div style="display: flex; gap: 10px;">
            <button class="add-btn" onclick="location.href='/config'" title="系统配置"><i class="fas fa-cog"></i></button>
            <button class="add-btn" onclick="showDiscoveryModal()"><i class="fas fa-plus"></i></button>
        </div>
    </div>

    <div class="container" id="device-sections">
        <!-- Devices injected by JS -->
        <div style="text-align: center; padding: 60px 20px; color: var(--text-muted);">
            <i class="fas fa-circle-notch fa-spin fa-3x" style="color: var(--primary);"></i>
            <p style="margin-top: 16px; font-size: 15px; font-weight: 500;">正在连接设备...</p>
        </div>
    </div>

    <!-- Discovery Modal -->
    <div id="discovery-modal" class="modal-overlay" onclick="hideDiscoveryModal(event)">
        <div class="modal-card" style="max-width: 420px;">
            <div class="modal-header">
                <div class="modal-title">添加新设备</div>
                <div class="modal-desc">选择要添加的设备类型，系统将自动为您配置</div>
            </div>
            <div class="discovery-grid">
                <div class="device-type-card" onclick="addDevice('feeder')">
                    <div class="device-type-content">
                        <div class="device-type-icon feeder">
                            <i class="fas fa-cookie-bite"></i>
                        </div>
                        <div class="device-type-info">
                            <div class="device-type-title">喂食机</div>
                            <div class="device-type-desc">云宠智能喂食机，支持定时投喂、远程控制</div>
                        </div>
                        <div class="device-type-arrow">
                            <i class="fas fa-chevron-right"></i>
                        </div>
                    </div>
                </div>

                <div class="device-type-card" onclick="addDevice('litterbox')">
                    <div class="device-type-content">
                        <div class="device-type-icon litterbox">
                            <i class="fas fa-cat"></i>
                        </div>
                        <div class="device-type-info">
                            <div class="device-type-title">猫厕所</div>
                            <div class="device-type-desc">PetKit 猫厕所，自动清理、健康监测</div>
                        </div>
                        <div class="device-type-arrow">
                            <i class="fas fa-chevron-right"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); text-align: center;">
                <button onclick="closeDiscoveryModal()" style="background: linear-gradient(135deg, #F1F5F9 0%, #E2E8F0 100%); border: none; padding: 12px 32px; border-radius: var(--radius-md); font-size: 14px; font-weight: 600; color: var(--text-secondary); cursor: pointer; transition: all 0.2s;">
                    <i class="fas fa-times"></i> 取消
                </button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">操作成功</div>

    <script>
        // Init
        fetchDashboardData();
        // 每30秒自动刷新一次（使用缓存，减轻服务器压力）
        setInterval(fetchDashboardData, 30000);

        // 每5分钟强制刷新一次第三方接口数据
        setInterval(forceRefreshData, 300000);

        async function fetchDashboardData() {
            try {
                const response = await fetch('/api/dashboard/data');
                const data = await response.json();

                const petkitDevices = data.petkit_devices || [];

                renderAllDevices(petkitDevices, data);
            } catch (error) {
                console.error('获取仪表板数据失败:', error);
                // 降级到旧方法
                await fallbackFetchDevices();
            }
        }

        async function fallbackFetchDevices() {
            try {
                // Parallel fetch
                const petkitRes = await fetch('/api/petkit/devices').catch(() => ({ json: () => [] }));
                const petkit = await petkitRes.json();

                renderAllDevices(Array.isArray(petkit) ? petkit : []);
            } catch (error) {
                console.error('Fallback fetch error:', error);
            }
        }

        async function forceRefreshData() {
            try {
                const response = await fetch('/api/cache/refresh', { method: 'POST' });
                const result = await response.json();
                if (result.status === 'success') {
                    showToast('数据已强制刷新');
                    // 刷新显示数据
                    await fetchDashboardData();
                }
            } catch (error) {
                console.error('强制刷新失败:', error);
            }
        }

        function renderAllDevices(petkit, dashboardData = {}) {
            const container = document.getElementById('device-sections');
            container.innerHTML = '';

            // --- 1. 宠物生活 ---
            container.innerHTML += `
                <div class="section-header">
                    <div class="section-icon">
                        <i class="fas fa-paw"></i>
                    </div>
                    <div class="section-title">宠物生活</div>
                </div>`;
            let petHtml = '<div class="device-grid">';

            // 1.1 动态显示云宠智能喂食机（仅当有配置时显示）
            if (dashboardData.cloudpets_servings !== undefined || dashboardData.cloudpets_plans !== undefined) {
                petHtml += `
                    <div class="device-card" onclick="location.href='/feeder'">
                        <div class="device-icon-wrapper feeder">
                            <i class="fas fa-cookie-bite"></i>
                            <div class="status-indicator online"></div>
                        </div>
                        <div class="device-info">
                            <div class="device-name">喂食机</div>
                            <div class="device-status">
                                <span class="status-text">在线</span>
                            </div>
                        </div>
                        <div class="device-stats">
                            <div class="stat-item">
                                <div class="stat-value" id="feeder-servings">--</div>
                                <div class="stat-label">今日投喂</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-value" id="feeder-remaining">--</div>
                                <div class="stat-label">计划剩余</div>
                            </div>
                        </div>
                        <div class="chevron"><i class="fas fa-chevron-right"></i></div>
                    </div>`;
            }

            // 1.2 动态扫描到的猫厕所
            const litterbox = petkit.find(d => {
                if (!d || !d.type) return false;
                const name = d.name || '';
                return ['T3', 'T4', 'T4 Pura MAX', 'T5'].includes(d.type) || name.includes('MAX');
            });

            if (litterbox) {
                // 优先使用缓存的统计数据
                let stats = {};
                if (dashboardData.litterbox_stats && dashboardData.litterbox_stats[litterbox.id]) {
                    stats = dashboardData.litterbox_stats[litterbox.id];
                } else if (litterbox.state_summary) {
                    stats = litterbox.state_summary;
                }
                petHtml += `
                    <div class="device-card" onclick="location.href='/litterbox?device_id=${litterbox.id}'">
                        <div class="device-icon-wrapper litterbox">
                            <i class="fas fa-cat"></i>
                            <div class="status-indicator online"></div>
                        </div>
                        <div class="device-info">
                            <div class="device-name">猫厕所</div>
                            <div class="device-status">
                                <span class="status-text">在线</span>
                            </div>
                        </div>
                        <div class="device-stats">
                            <div class="stat-item">
                                <div class="stat-value">${stats.today_visits || stats.used_times || 0}次</div>
                                <div class="stat-label">今日如厕</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-value">${stats.sand_percent || 0}%</div>
                                <div class="stat-label">猫砂余量</div>
                            </div>
                        </div>
                        <div class="chevron"><i class="fas fa-chevron-right"></i></div>
                    </div>`;
            } else {
                petHtml += `
                    <div class="device-card" onclick="showToast('正在搜索设备...')">
                        <div class="device-icon-wrapper offline">
                            <i class="fas fa-cat"></i>
                            <div class="status-indicator offline"></div>
                        </div>
                        <div class="device-info">
                            <div class="device-name">猫厕所</div>
                            <div class="device-status">
                                <span class="status-text">未连接</span>
                            </div>
                        </div>
                        <div class="device-stats" style="opacity:0.5;">
                            <div class="stat-item">
                                <div class="stat-value">--</div>
                                <div class="stat-label">今日如厕</div>
                            </div>
                        </div>
                        <div class="chevron"><i class="fas fa-chevron-right"></i></div>
                    </div>`;
            }

            petHtml += '</div>';
            container.innerHTML += petHtml;

            // --- 2. 健康与体质 (体重秤 - 已移除)
            // Deleted: 体重秤功能已移除，因为已知设备列表为空

            // 更新喂食机统计数据
            updateFeederStats(dashboardData);
        }

        async function updateFeederStats(dashboardData = {}) {
            try {
                let servings = 0;
                let plans = [];

                // 优先使用缓存数据
                if (dashboardData.cloudpets_servings) {
                    servings = dashboardData.cloudpets_servings.result || 0;
                } else {
                    // 降级到实时获取
                    const servingsRes = await fetch('/api/cloudpets/servings_today');
                    const servingsData = await servingsRes.json();
                    if (servingsData.code === 200) {
                        servings = servingsData.result || 0;
                    }
                }

                if (dashboardData.cloudpets_plans) {
                    plans = dashboardData.cloudpets_plans;
                } else {
                    // 降级到实时获取
                    const plansRes = await fetch('/api/cloudpets/plans');
                    plans = await plansRes.json();
                }

                // 更新界面显示
                const servingsEl = document.getElementById('feeder-servings');
                if (servingsEl) {
                    servingsEl.innerText = `${servings} 次`;
                }

                if (Array.isArray(plans)) {
                    // 获取当前时间 HH:mm
                    const now = new Date();
                    const currentMinutes = now.getHours() * 60 + now.getMinutes();

                    let remaining = 0;
                    plans.forEach(p => {
                        // 确保 plan 结构中有 time 且 enabled
                        if (p.time && p.enabled !== false && p.enabled !== 0 && p.enabled !== '0') {
                            const [h, m] = p.time.split(':').map(Number);
                            const planMinutes = h * 60 + m;
                            if (planMinutes > currentMinutes) {
                                remaining++;
                            }
                        }
                    });

                    const remainingEl = document.getElementById('feeder-remaining');
                    if (remainingEl) remainingEl.innerText = `${remaining} 次`;
                }
            } catch (e) {
                console.error('Failed to update feeder stats', e);
            }
        }

        async function updateLastWeight(deviceId) {
             try {
                const res = await fetch(`/api/devices/${deviceId}/history?limit=1`);
                const history = await res.json();
                if (history && history.length > 0) {
                    const el = document.getElementById(`last-weight-${deviceId}`);
                    if (el) el.innerText = `${history[0].weight.toFixed(2)} kg`;
                }
            } catch (e) {}
        }

        // --- Discovery Modal ---
        function showDiscoveryModal() {
            document.getElementById('discovery-modal').classList.add('show');
        }

        function closeDiscoveryModal() {
            document.getElementById('discovery-modal').classList.remove('show');
        }

        function hideDiscoveryModal(e) {
            if (e.target.id === 'discovery-modal') {
                closeDiscoveryModal();
            }
        }

        function addDevice(type) {
            closeDiscoveryModal();

            if (type === 'feeder') {
                showToast('正在配置喂食机...');
                // 跳转到喂食机配置或显示配置提示
                setTimeout(() => {
                    location.href = '/feeder';
                }, 1000);
            } else if (type === 'litterbox') {
                showToast('正在配置猫厕所...');
                // 跳转到猫厕所配置或显示配置提示
                setTimeout(() => {
                    location.href = '/litterbox';
                }, 1000);
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>

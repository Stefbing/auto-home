<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统配置</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #6366F1;
            --primary-light: #E0E7FF;
            --primary-dark: #4F46E5;
            --secondary: #8B5CF6;
            --bg: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-primary: #1E293B;
            --text-secondary: #64748B;
            --text-muted: #94A3B8;
            --border: #E2E8F0;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #E0E7FF 0%, #F8FAFC 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
            position: relative;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="2" fill="white" opacity="0.1"/></svg>');
            opacity: 0.3;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 12px;
            font-weight: 800;
            position: relative;
            z-index: 1;
        }

        .header p {
            opacity: 0.95;
            font-size: 15px;
            position: relative;
            z-index: 1;
        }

        .content {
            padding: 40px 30px;
        }

        .alert {
            padding: 16px 20px;
            border-radius: var(--radius-md);
            margin-bottom: 24px;
            display: none;
            font-weight: 500;
        }

        .alert.warning {
            background: linear-gradient(135deg, #FEF3C7 0%, #FDE68A 100%);
            border-left: 4px solid var(--warning);
            color: #92400E;
            display: block;
        }

        .alert.success {
            background: linear-gradient(135deg, #D1FAE5 0%, #A7F3D0 100%);
            border-left: 4px solid var(--success);
            color: #065F46;
            display: block;
        }

        .alert.error {
            background: linear-gradient(135deg, #FEE2E2 0%, #FECACA 100%);
            border-left: 4px solid var(--danger);
            color: #991B1B;
            display: block;
        }

        .config-section {
            margin-bottom: 36px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 3px solid var(--primary-light);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .config-item {
            margin-bottom: 24px;
        }

        .config-label {
            display: block;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 10px;
            font-size: 14px;
        }

        .config-label .required {
            color: var(--danger);
            margin-left: 4px;
        }

        .config-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 14px;
            transition: all 0.3s;
            background: var(--card-bg);
            font-family: inherit;
        }

        .config-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-light);
        }

        .config-input.encrypted {
            background: linear-gradient(135deg, #F8FAFC 0%, #F1F5F9 100%);
        }

        .config-hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 8px;
            font-weight: 500;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 36px;
        }

        .btn {
            flex: 1;
            padding: 16px 24px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #F1F5F9 0%, #E2E8F0 100%);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: linear-gradient(135deg, #E2E8F0 0%, #CBD5E1 100%);
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: var(--text-secondary);
        }

        .spinner {
            border: 4px solid var(--border);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            animation: spin 1s linear infinite;
            margin: 0 auto 24px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .nav-link {
            display: inline-block;
            margin-top: 16px;
            color: white;
            text-decoration: none;
            font-size: 14px;
            opacity: 0.95;
            font-weight: 600;
            transition: all 0.2s;
        }

        .nav-link:hover {
            opacity: 1;
            transform: translateX(-4px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-cog"></i> 系统配置</h1>
            <p>管理账号和数据库配置信息（敏感信息已加密存储）</p>
            <a href="/" class="nav-link"><i class="fas fa-arrow-left"></i> 返回首页</a>
        </div>

        <div class="content">
            <div id="alertBox" class="alert"></div>

            <div id="loadingState" class="loading">
                <div class="spinner"></div>
                <p>加载配置中...</p>
            </div>

            <form id="configForm" style="display: none;">
                <div class="config-section">
                    <div class="section-title">
                        <i class="fas fa-cat" style="color: var(--primary);"></i>
                        PetKit / CloudPets 账号
                    </div>
                    
                    <div class="config-item">
                        <label class="config-label">
                            ACCOUNT (账号)
                            <span class="required">*</span>
                        </label>
                        <input type="text" id="ACCOUNT" class="config-input encrypted" placeholder="例如：86-17757577548">
                        <div class="config-hint">带区号的手机号，用于 PetKit 和 CloudPets 登录</div>
                    </div>

                    <div class="config-item">
                        <label class="config-label">
                            PASSWORD (密码)
                            <span class="required">*</span>
                        </label>
                        <input type="password" id="PASSWORD" class="config-input encrypted" placeholder="请输入密码">
                        <div class="config-hint">账号对应的密码</div>
                    </div>
                </div>

                <div class="config-section">
                    <div class="section-title">
                        <i class="fas fa-home" style="color: var(--primary);"></i>
                        小米账号
                    </div>
                    
                    <div class="config-item">
                        <label class="config-label">
                            XIAOMI_ACCOUNT (小米账号)
                            <span class="required">*</span>
                        </label>
                        <input type="text" id="XIAOMI_ACCOUNT" class="config-input encrypted" placeholder="例如：18021518830">
                        <div class="config-hint">小米账号手机号或邮箱</div>
                    </div>

                    <div class="config-item">
                        <label class="config-label">
                            XIAOMI_PASSWORD (小米密码)
                            <span class="required">*</span>
                        </label>
                        <input type="password" id="XIAOMI_PASSWORD" class="config-input encrypted" placeholder="请输入密码">
                        <div class="config-hint">小米账号密码</div>
                    </div>
                </div>

                <div class="config-section">
                    <div class="section-title">
                        <i class="fas fa-database" style="color: var(--primary);"></i>
                        数据库配置
                    </div>
                    
                    <div class="config-item">
                        <label class="config-label">
                            DATABASE_URL (数据库连接)
                            <span class="required">*</span>
                        </label>
                        <input type="text" id="DATABASE_URL" class="config-input encrypted" 
                               placeholder="mysql+pymysql://user:pass@host:port/database">
                        <div class="config-hint">支持 MySQL、PostgreSQL、SQLite</div>
                    </div>

                    <div class="config-item">
                        <label class="config-label">PETKIT_DISABLE_SSL_VERIFY</label>
                        <select id="PETKIT_DISABLE_SSL_VERIFY" class="config-input">
                            <option value="false">false (默认)</option>
                            <option value="true">true (仅开发环境)</option>
                        </select>
                        <div class="config-hint">遇到 SSL 证书错误时启用</div>
                    </div>
                </div>

                <div class="btn-group">
                    <button type="button" class="btn btn-secondary" onclick="loadConfigs()">重置</button>
                    <button type="submit" class="btn btn-primary">保存配置</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = '/api/config';

        // 页面加载时获取配置
        window.addEventListener('DOMContentLoaded', () => {
            loadConfigs();
        });

        async function loadConfigs() {
            try {
                showLoading(true);
                hideAlert();

                const response = await fetch(`${API_BASE}/list`);
                if (!response.ok) throw new Error('加载配置失败');

                const data = await response.json();
                
                // 填充表单
                const configMap = {};
                data.configs.forEach(config => {
                    configMap[config.key] = config.value;
                });

                // 设置字段值
                ['ACCOUNT', 'PASSWORD', 'XIAOMI_ACCOUNT', 'XIAOMI_PASSWORD', 'DATABASE_URL', 'PETKIT_DISABLE_SSL_VERIFY'].forEach(key => {
                    const input = document.getElementById(key);
                    if (input && configMap[key] !== undefined) {
                        input.value = configMap[key];
                    }
                });

                // 检查必需配置
                if (!data.has_required_configs) {
                    showAlert('warning', '⚠️ 检测到部分必需配置缺失，请完善配置信息');
                } else {
                    showAlert('success', '✅ 所有必需配置已完成');
                }

                showLoading(false);
                document.getElementById('configForm').style.display = 'block';

            } catch (error) {
                console.error('加载配置失败:', error);
                showAlert('error', '❌ 加载配置失败: ' + error.message);
                showLoading(false);
            }
        }

        // 保存配置
        document.getElementById('configForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            try {
                const submitBtn = e.target.querySelector('button[type="submit"]');
                submitBtn.disabled = true;
                submitBtn.textContent = '保存中...';

                const configs = [
                    'ACCOUNT', 'PASSWORD', 'XIAOMI_ACCOUNT', 'XIAOMI_PASSWORD', 
                    'DATABASE_URL', 'PETKIT_DISABLE_SSL_VERIFY'
                ];

                // 逐个保存配置
                for (const key of configs) {
                    const input = document.getElementById(key);
                    if (input) {
                        const response = await fetch(API_BASE, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                key: key,
                                value: input.value.trim(),
                                is_encrypted: input.classList.contains('encrypted')
                            })
                        });

                        if (!response.ok) {
                            const error = await response.json();
                            throw new Error(error.detail || `保存 ${key} 失败`);
                        }
                    }
                }

                showAlert('success', '✅ 配置保存成功！系统将使用新配置重启服务');
                
                // 3秒后刷新页面
                setTimeout(() => {
                    location.reload();
                }, 3000);

            } catch (error) {
                console.error('保存配置失败:', error);
                showAlert('error', '❌ 保存失败: ' + error.message);
            } finally {
                const submitBtn = e.target.querySelector('button[type="submit"]');
                submitBtn.disabled = false;
                submitBtn.textContent = '保存配置';
            }
        });

        function showAlert(type, message) {
            const alertBox = document.getElementById('alertBox');
            alertBox.className = `alert ${type}`;
            alertBox.textContent = message;
            alertBox.style.display = 'block';
        }

        function hideAlert() {
            document.getElementById('alertBox').style.display = 'none';
        }

        function showLoading(show) {
            document.getElementById('loadingState').style.display = show ? 'block' : 'none';
        }
    </script>
</body>
</html>
